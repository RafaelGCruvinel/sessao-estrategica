<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#B8743A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8743A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top eyebrow -->
  <text x="80" y="105" font-family="'Inter', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#D08F58">
    REFORMA TRIBUTÁRIA · IBS · CBS
  </text>

  <!-- Main headline -->
  <text x="80" y="220" font-family="Georgia, serif" font-size="72" font-weight="500" fill="#F4F5F7" letter-spacing="-2">
    Sua margem em
  </text>
  <text x="600" y="220" font-family="Georgia, serif" font-size="72" font-weight="300" font-style="italic" fill="#D08F58" letter-spacing="-2">
    2027
  </text>
  <text x="80" y="305" font-family="Georgia, serif" font-size="58" font-weight="300" fill="#A9B6D2" letter-spacing="-2">
    não vai ser definida
  </text>
  <text x="80" y="375" font-family="Georgia, serif" font-size="58" font-weight="300" fill="#A9B6D2" letter-spacing="-2">
    pela alíquota.
  </text>

  <!-- Divider -->
  <line x1="80" y1="445" x2="160" y2="445" stroke="#B8743A" stroke-width="3"/>

  <!-- Subtitle -->
  <text x="80" y="495" font-family="'Inter', sans-serif" font-size="26" font-weight="400" fill="#D6DAE2">
    Honorário 100% atrelado à economia comprovada.
  </text>

  <!-- Bottom logo -->
  <text x="80" y="570" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#F4F5F7">
    Sessão
  </text>
  <text x="195" y="570" font-family="Georgia, serif" font-size="28" font-weight="300" font-style="italic" fill="#D08F58">
    Estratégica
  </text>

  <!-- Decorative corner element -->
  <g transform="translate(1000, 500)" opacity="0.4">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#B8743A" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#B8743A" stroke-width="1"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#B8743A" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="#B8743A"/>
  </g>
</svg>
